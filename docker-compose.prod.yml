version: '3.8'

services:
  # 1. S3 Database & API Backend
  s3-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: excalidraw-s3-backend
    restart: always
    environment:
      - PORT=5000
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    ports:
      - "5000:5000"

  # 2. Excalidraw Frontend (Static Web Application)
  excalidraw-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excalidraw-frontend
    restart: always
    ports:
      - "3002:80"
    depends_on:
      - s3-backend
